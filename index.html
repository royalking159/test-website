<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <meta name="color-scheme" content="dark light">
  <!-- Sends visitors to the homepage automatically. The script keeps any #/page or ?query; the meta tag is the fallback. -->
  <meta http-equiv="refresh" content="0; url=site/">
  <link rel="canonical" href="site/">
  <script>location.replace("site/" + location.search + location.hash);</script>
</head>
<body>
  <p>Taking you to the <a href="site/">homepage</a>...</p>
</body>
</html>
