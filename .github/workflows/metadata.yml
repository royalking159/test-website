name: Build Stremio Addon

on:
  push:
    branches:
      - main
    # This prevents an infinite loop by ignoring pushes made by the bot itself
    paths-ignore:
      - 'manifest.json'
      - 'catalog/**'
      - 'meta/**'
      - 'stream/**'
      - 'index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build script
        run: node scripts/build-stremio.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add manifest.json catalog/ meta/ stream/ index.html
          git diff --staged --quiet || git commit -m "Auto-build Stremio addon files [skip ci]"
          git push
