name: Update movie metadata
on:
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  schedule:
    - cron: "0 3 * * 1"       # and every Monday
  push:
    paths: ["config.js"]      # and whenever you edit your movie list
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-metadata.mjs
        env:
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_PIN: ${{ secrets.TVDB_PIN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add metadata.json
          git diff --cached --quiet || (git commit -m "Update movie metadata" && git push)
